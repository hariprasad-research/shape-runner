<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Play Cosmic Blocks, a colorful matching puzzle with cosmic energy." />
    <title>Cosmic Blocks | Arasan Games</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../../index.html" aria-label="Arasan Games home">
        <img src="../../assets/logo/logo.svg" alt="Arasan Games logo" />
        <span>Arasan Games</span>
      </a>
      <nav class="site-nav" id="siteNav" aria-label="Primary navigation">
        <a href="../../index.html">Home</a>
        <a href="../../games.html">Games</a>
        <a href="../../about.html">About</a>
        <a href="../../contact.html">Contact</a>
      </nav>
    </header>

    <main class="game-page-shell">
      <section class="page-hero">
        <div class="page-hero-copy">
          <p class="eyebrow">Featured title</p>
          <h1>Cosmic Blocks</h1>
          <p>Match glowing cosmic blocks and clear the board before the stars run out.</p>
          <div class="hero-actions">
            <button id="resetBtn" class="btn btn-primary">Restart Puzzle</button>
            <a class="btn btn-secondary" href="../../games.html">Back to library</a>
          </div>
        </div>
      </section>

      <section class="glass-card section-card game-card-shell">
        <div class="game-status">
          <p id="scoreText">Matches: 0</p>
          <p id="messageText">Pick two blocks to find a matching pair.</p>
        </div>
        <div id="board" class="memory-board"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
