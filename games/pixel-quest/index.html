<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Play Pixel Quest, a small adventure game with collectibles and a heroic finish." />
    <title>Pixel Quest | Arasan Games</title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../../index.html" aria-label="Arasan Games home">
        <img src="../../assets/logo/logo.svg" alt="Arasan Games logo" />
        <span>Arasan Games</span>
      </a>
      <nav class="site-nav" id="siteNav" aria-label="Primary navigation">
        <a href="../../index.html">Home</a>
        <a href="../../games.html">Games</a>
        <a href="../../about.html">About</a>
        <a href="../../contact.html">Contact</a>
      </nav>
    </header>

    <main class="game-page-shell">
      <section class="page-hero">
        <div class="page-hero-copy">
          <p class="eyebrow">Featured title</p>
          <h1>Pixel Quest</h1>
          <p>Travel through a tiny pixel world, collect stars, and reach the portal to finish the quest.</p>
          <div class="hero-actions">
            <button id="startQuestBtn" class="btn btn-primary">Start Quest</button>
            <a class="btn btn-secondary" href="../../games.html">Back to library</a>
          </div>
        </div>
      </section>

      <section class="glass-card section-card game-card-shell">
        <canvas id="questCanvas" width="560" height="320"></canvas>
        <p id="questStatus">Use the arrow keys to move, collect the stars, and reach the portal.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
