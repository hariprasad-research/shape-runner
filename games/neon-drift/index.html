<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Play Neon Drift, a lane-hopping arcade challenge with glowing neon roads." />
    <title>Neon Drift | GameVerse </title>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/responsive.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-page-shell">
      <section class="page-hero">
        <div class="page-hero-copy">
          <p class="eyebrow">Featured title</p>
          <h1>Neon Drift</h1>
          <p>Stay in the flow as glowing tracks zip by and dodge hazards in this fast lane-shifting arcade challenge.</p>
          <div class="hero-actions">
            <button id="startBtn" class="btn btn-primary">Play Game</button>
            <a class="btn btn-secondary" href="../../games.html">Back to library</a>
          </div>
        </div>
      </section>

      <section class="glass-card section-card game-card-shell">
        <div class="game-canvas-frame">
          <canvas id="gameCanvas" width="520" height="360"></canvas>
        </div>
        <div class="game-controls">
          <div class="control-row">
            <button class="btn btn-secondary" data-dir="left">◀ Left</button>
            <button class="btn btn-primary" data-dir="right">Right ▶</button>
          </div>
          <p id="statusText">Tap play and steer with arrow keys or the on-screen buttons.</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
